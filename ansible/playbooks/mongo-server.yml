- name: Deploy mongodb server
  hosts: mongo_servers
  become: true
  vars_files:
    - ../secrets.yml
  vars:
    mongodb_admin_user: "{{ db.auth.admin.user }}"
    mongodb_admin_password: "{{ db.auth.admin.password }}"
    mongodb_app_user: "{{ db.auth.app.user }}"
    mongodb_app_password: "{{ db.auth.app.password }}"
    mongodb_backup_user: "{{ db.auth.backup.user }}"
    mongodb_backup_password: "{{ db.auth.backup.password }}"
    mongodb_restore_user: "{{ db.auth.restore.user }}"
    mongodb_restore_password: "{{ db.auth.restore.password }}"

  tasks:

    # Check for mongo and ubuntu version variables.
    # Both of these variables are used in the mongo_install_and_config role and this will avoid surprises from falling back to defaults

    - name: Fail if mongo version is undefined
      fail:
        msg: "Mongo version undefined. Please set the mongodb_major_version variable."
      when: mongodb_major_version is not defined

    - name: Fail if ubuntu version is undefined
      fail:
        msg: "Ubuntu version undefined. Please set the ubuntu_version_codename variable."
      when: ubuntu_version_codename is not defined

    - debug:
        msg: "Mongo version is {{ mongodb_major_version }} and Ubuntu version is {{ ubuntu_version_codename }}"

    - name: update apt packages
      apt:
        update-cache: yes
        upgrade: dist
      become: true

    # Install and configure mongodb
    - import_role:
        name: mongo_install_and_config

    # Setup users
    - import_role:
        name: mongo_users

    # Restore from S3 unless explicitly skipped
    - name: mongo_s3_restore
      import_role:
        name: mongo_s3_restore
      vars:
        mongo_s3_restore_db_user: "{{ mongodb_restore_user }}"
        mongo_s3_restore_db_password: "{{ mongodb_restore_password }}"
      when: mongo_s3_restore_s3_bucket is defined and ( mongo_skip_s3_restore | default(false) == false )

    # Setup backup script unless explicitly skipped
    - import_role:
        name: mongo_backup_cron_v2
      vars:
        mongo_backup_cron_v2_db_user: "{{ mongodb_backup_user }}"
        mongo_backup_cron_v2_db_password: "{{ mongodb_backup_password }}"
        mongo_backup_cron_v2_s3_bucket: "{{ mongo_s3_backup_s3_bucket }}"
        mongo_backup_cron_v2_aws_region: "{{ hostvars[ groups['control'][0] ].aws_region }}"
      when: mongo_skip_s3_backups | default(false) == false

    - import_role:
        name: cleanup