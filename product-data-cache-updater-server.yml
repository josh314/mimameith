- name: configure product data cache updater server
  hosts: product_data_cache_updater
  vars_files:
    - secrets.yml
  vars:
    product_data_cache_updater__application_repository_version: production
    path: "{{ ansible_env.HOME }}/product-data-cache-updater"

  # TODO? use HTTP2

  tasks:

    - name: Upgrade packages
      become: yes
      apt: 
        upgrade: yes
        update_cache: yes
        cache_valid_time: 3600

    # install npm/node and global node packages
    - import_role:
        name: geerlingguy.nodejs
      become: yes
      vars:
        nodejs_version: "18.x"

    - name: Stop app if already running. Ignore error caused by app not running yet 
      command: pm2 stop process.json
      args:
        chdir: "{{ path }}"
      ignore_errors: yes

    - import_role: 
        name: product_data_cache_updater
      vars:
        product_data_cache_updater__application_repository: git@gitlab.com:wazue/product-data-cache-updater.git
        product_data_cache_updater__project_path: "{{ path }}"
        local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
        remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/id_ed25519
        db_product_data_cache_updater_user: "{{ db.auth.product_data_cache_updater.user }}"
        db_product_data_cache_updater_password: "{{ db.auth.product_data_cache_updater.password }}"
        upcitemdb_user_key: "{{ upcitemdb.user_key }}"

    - import_role:
        name: pm2_app_service
      vars:
        pm2_app_service__path: "{{ path }}"

    - import_role:
        name: cleanup