---

####################################################
# Control
# =======
#
# These variables are for the control machine which performs the EC2 provisioning
#
############################################################


#################################
# AMIs
ami_id__ubuntu_20_04_lts: ami-09e67e426f25ce0d7
ami_id__ubuntu_24_04_lts: ami-04b70fa74e45c3917


#################################
# Environment & stack settings

# environment name
stack_env: prod
org: wholesale-ninjas

# atlas cluster settings
db_atlas: true
db_atlas__cluster_name: ehdb-dev
# db_atlas__cluster_url: ehdb-dev.jna1s.mongodb.net

# AWS VPC settings
vpc_id: vpc-39092a5d # us-east-1, default
public_subnet_id: subnet-42df0468 # us-east-1 public subnet

# AWS security group settings
aws_security_group__default: sg-ef6fc897 # Default
aws_security_group__internal: sg-052e5c37ecfa0cd7b # Internal
aws_security_group__public_web_server: sg-3fe45677 # Public web server
aws_security_group__outbound_web: sg-04a9528a6686b9905 # outbound web
aws_security_group__lot_commander_load_balancer: sg-0354ff7a734f377c3 # lot_commander::load_balancer
aws_security_group__lot_commander_app_server: sg-091a4954b4f624c04 # lot_commander::app_server
aws_security_group__expresshop_manifest_service: sg-07008ab6c9c5dd60b # expresshop_service::manifest
aws_security_group__mongodb_atlas_access: sg-08cd43e238b3578ae # atlas-ehdb-access


#################################
# Instance settings

# AWS instance settings for the load balancer
load_balancer_ami: "{{ ami_id__ubuntu_24_04_lts }}"
load_balancer_instance_type: t3.nano
load_balancer_region: us-east-1
load_balancer_key_name: josh-key-pair-useast
load_balancer_key_file: ~/.ssh/josh-key-pair-useast.pem

load_balancer_eip: 34.235.84.237

# AWS instance settings for the application servers
app_server_ami: "{{ ami_id__ubuntu_24_04_lts }}"
app_server_instance_type: t3.small
app_server_region: us-east-1
app_server_key_name: josh-key-pair-useast
app_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_app_servers: 1

# AWS instance settings for the manifest service instances
manifest_service_ami: "{{ ami_id__ubuntu_24_04_lts }}"
manifest_service_instance_type: t3.nano
manifest_service_region: us-east-1
manifest_service_key_name: josh-key-pair-useast
manifest_service_key_file: ~/.ssh/josh-key-pair-useast.pem
num_manifest_service: 1

# AWS instance settings for the shopify_data_dump server
shopify_data_dump_server_ami: "{{ ami_id__ubuntu_24_04_lts }}"
shopify_data_dump_server_instance_type: t3.micro
shopify_data_dump_server_region: us-east-1
shopify_data_dump_server_key_name: josh-key-pair-useast
shopify_data_dump_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_shopify_data_dump_server: 1

# AWS instance settings for the shopify_mailchimp_campaigner_cron server
shopify_mailchimp_campaigner_server_ami: "{{ ami_id__ubuntu_24_04_lts }}"
shopify_mailchimp_campaigner_server_instance_type: t3.nano
shopify_mailchimp_campaigner_server_region: us-east-1
shopify_mailchimp_campaigner_server_key_name: josh-key-pair-useast
shopify_mailchimp_campaigner_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_shopify_mailchimp_campaigner_server: 1

# AWS instance settings for the product_data_cache_updater server
product_data_cache_updater_server_ami: "{{ ami_id__ubuntu_24_04_lts }}"
product_data_cache_updater_server_instance_type: t3.nano
product_data_cache_updater_server_region: us-east-1
product_data_cache_updater_server_key_name: josh-key-pair-useast
product_data_cache_updater_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_product_data_cache_updater_server: 1


# AWS instance settings for the cronbox
cronbox_ami: "{{ ami_id__ubuntu_24_04_lts }}"
cronbox_instance_type: t3.nano
cronbox_region: us-east-1
cronbox_key_name: josh-key-pair-useast
cronbox_key_file: ~/.ssh/josh-key-pair-useast.pem
num_cronbox: 1


# Client servers

# AWS instance settings for the load balancer
client_load_balancer_ami: "{{ ami_id__ubuntu_24_04_lts }}"
client_load_balancer_instance_type: t3.nano
client_load_balancer_region: us-east-1
client_load_balancer_key_name: josh-key-pair-useast
client_load_balancer_key_file: ~/.ssh/josh-key-pair-useast.pem

# AWS instance settings for the application servers
client_app_server_ami: "{{ ami_id__ubuntu_24_04_lts }}"
client_app_server_instance_type: t3.micro
client_app_server_region: us-east-1
client_app_server_key_name: josh-key-pair-useast
client_app_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_client_app_servers: 1
