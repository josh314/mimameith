---

####################################################
# Control
# =======
#
# These variables are for the control machine which performs the EC2 provisioning
#
############################################################

#################################
# Environment & stack settings

# environment name
stack_env: dev
org: wholesale-ninjas


# AWS instance settings for the database servers
db_server_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
db_server_instance_type: t3.small
db_server_region: us-east-1
db_server_key_name: josh-key-pair-useast
db_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_db_servers: 1

# AWS instance settings for the load balancer
load_balancer_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
load_balancer_instance_type: t3.nano
load_balancer_region: us-east-1
load_balancer_key_name: josh-key-pair-useast
load_balancer_key_file: ~/.ssh/josh-key-pair-useast.pem

load_balancer_eip: 34.194.49.225

# AWS instance settings for the application servers
app_server_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
app_server_instance_type: t3.micro
app_server_region: us-east-1
app_server_key_name: josh-key-pair-useast
app_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_app_servers: 1

# AWS instance settings for the manifest service instances
manifest_service_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
manifest_service_instance_type: t3.nano
manifest_service_region: us-east-1
manifest_service_key_name: josh-key-pair-useast
manifest_service_key_file: ~/.ssh/josh-key-pair-useast.pem
num_manifest_service: 1

# AWS instance settings for the shopify_data_dump server
shopify_data_dump_server_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
shopify_data_dump_server_instance_type: t3.micro
shopify_data_dump_server_region: us-east-1
shopify_data_dump_server_key_name: josh-key-pair-useast
shopify_data_dump_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_shopify_data_dump_server: 1


# AWS instance settings for the shopify_mailchimp_campaigner_cron server
shopify_mailchimp_campaigner_server_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
shopify_mailchimp_campaigner_server_instance_type: t3.nano
shopify_mailchimp_campaigner_server_region: us-east-1
shopify_mailchimp_campaigner_server_key_name: josh-key-pair-useast
shopify_mailchimp_campaigner_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_shopify_mailchimp_campaigner_server: 1


# AWS instance settings for the product_data_cache_updater server
product_data_cache_updater_server_ami: ami-09e67e426f25ce0d7 # ubuntu 20.4 LTS
product_data_cache_updater_server_instance_type: t3.nano
product_data_cache_updater_server_region: us-east-1
product_data_cache_updater_server_key_name: josh-key-pair-useast
product_data_cache_updater_server_key_file: ~/.ssh/josh-key-pair-useast.pem
num_product_data_cache_updater_server: 1
