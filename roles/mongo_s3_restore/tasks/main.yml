# If the object key isn't specified, use aws-cli shell script to get latest object
- name: Obtain most recent object from bucket
  block:

    - name: Install pip
      apt:
        name: python3-pip
        update_cache: yes
      become: yes

    - name: python dependencies
      pip: 
        name:
          - boto3

    - import_role:
        name: aws_profiles
      vars:
        aws_profiles__profiles:
          - aws_access_key_id: "{{ mongo_s3_restore_aws_access_key }}"
            aws_secret_access_key: "{{ mongo_s3_restore_aws_secret_key }}"
            region: "{{ mongo_s3_restore_aws_region | default(None) }}"

    - name: copy shell script for getting most recent backup from S3
      copy:
        src: get-most-recent-backup-from-bucket.py
        dest: "{{ mongo_s3_restore_working_dir }}/get-most-recent-backup-from-bucket.py"
        mode: 0755

    - name: Run script and register output
      shell:
        cmd: ./get-most-recent-backup-from-bucket.py {{ mongo_s3_restore_s3_bucket }}
        chdir: "{{ mongo_s3_restore_working_dir }}"
      become_user: "{{ mongo_s3_restore_boto_script_user }}"
      register: script_result

    - set_fact:
        mongo_s3_restore_s3_object: "{{ script_result.stdout }}"

  when: mongo_s3_restore_s3_object is not defined

# By now, mongo_s3_restore_s3_object should be defined. If not, end playbook
- name: End play if there exists no S3 object to restore from
  block:
    - debug:
        msg: No mongodb archive found in S3. Exiting...

    - name: End play if there exists no S3 object to restore from
      meta: end_play
  when: mongo_s3_restore_s3_object is not defined

- name: Retrieve S3 object
  aws_s3:
    aws_access_key: "{{ mongo_s3_restore_aws_access_key }}"
    aws_secret_key: "{{ mongo_s3_restore_aws_secret_key }}"
    bucket: "{{ mongo_s3_restore_s3_bucket }}"
    object: "{{ mongo_s3_restore_s3_object }}"
    dest: "{{ mongo_s3_restore_working_dir }}/{{ mongo_s3_restore_s3_object }}"
    mode: get

- name: unpack the saved S3 object
  unarchive:
    remote_src: yes
    src: "{{ mongo_s3_restore_working_dir }}/{{ mongo_s3_restore_s3_object }}"
    dest: "{{ mongo_s3_restore_working_dir }}/dump"

- name: Restore from the unpacked mongo dump
  command: >
    mongorestore
    {{ mongo_s3_restore_working_dir }}/dump
    --host={{ mongo_s3_restore_db_host }}
    --port={{ mongo_s3_restore_db_port }}
    --username={{ mongo_s3_restore_db_user }}
    --password={{ mongo_s3_restore_db_password }}
    --gzip
    --nsExclude=admin.*
    --numParallelCollections=1
    --numInsertionWorkersPerCollection=1
    -vvvvv

- name: Burninate working directory
  file:
    path: "{{ mongo_s3_restore_working_dir }}"
    state: absent

