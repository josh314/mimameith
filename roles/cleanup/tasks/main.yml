- name: Clean up apt packages
  apt:
    autoclean: yes
    autoremove: yes
  become: yes

- name: check if reboot necessary
  stat: path=/var/run/reboot-required
  register: reboot_required_file

- name: Rebooting
  reboot:
    reboot_timeout: 3600
  become: yes
  when: reboot_required_file.stat.exists