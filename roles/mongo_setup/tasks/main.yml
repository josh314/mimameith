- name: Import the public key used by the package management system
  apt_key:
    # keyserver: hkp://keyserver.ubuntu.com:80
    # id: 7F0CEB10
    url: https://www.mongodb.org/static/pgp/server-4.2.asc
    state: present

- name: Add MongoDB repository
  apt_repository:
    repo: deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu bionic/mongodb-org/4.2 multiverse
    state: present

- name: install mongodb
  apt:
    pkg: mongodb-org 
    state: latest 
    update_cache: yes
  # notify:
  # - start mongodb

- name: install config file
  template:
    src: mongod.conf.j2
    dest: "{{ mongodb_config_file }}"
    mode: 0644
    owner: root

- name: ensure database directory and permissions
  file:
    name:
      - "{{ mongodb_db_dir_path }}"
      - "{{ mongodb_log_dir_path }}"
    state: directory
    mode: 0755
    owner: "{{ mongodb_system_user }}"
    group: "{{ mongodb_system_group }}"

- name: start mongodb daemon
  service:
    name: mongod
    state: restarted
    enabled: yes

- name: Install pip
  apt:
    name: python3-pip

- name: Install python packages
  pip:
    name:
      - pymongo
    # virtualenv options?

- name: Ensure replicaset rs0 exists
  mongodb_replicaset: # see https://docs.ansible.com/ansible/latest/modules/mongodb_replicaset_module.html
    login_host: localhost
    login_port: "{{ mongodb_port }}"
    login_user: "{{ mongodb_admin_user }}"
    login_password: "{{ mongodb_admin_password }}"
    login_database: admin
    replica_set: rs0
    members: localhost:{{ mongodb_port }}
    validate: no

- name: Setup mongo users # is this redundant with `mongodb_replicaset`?
  mongodb_user: # see https://docs.ansible.com/ansible/latest/modules/mongodb_user_module.html
    login_host: localhost
    login_port: "{{ mongodb_port }}"
    login_user: "{{ mongodb_app_user }}"
    login_password: "{{ mongodb_app_password }}"
    login_database: admin

