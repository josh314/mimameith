- name: copy deploy key
  copy: src={{ local_deploy_key_file }} dest={{ remote_deploy_key_file }} mode=0600

- name: install lot-commander repo
  git: 
    repo: "{{ application_repository }}"
    version: "{{ application_repository_version }}"
    dest: "{{ project_path }}"
    accept_hostkey: yes
    force: yes

- name: install application config file
  template: 
    src: config.j2
    dest: "{{ project_path }}/config.js"
    lstrip_blocks: yes
  vars:
    store: "{{ shopify[shopify_store] }}"

- name: install pm2 process file
  template:
    src: process.json.j2
    dest: "{{ project_path }}/process.json"
    lstrip_blocks: yes

- name: create .aws directory
  file:
    path: "{{ aws_credentials_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory

- name: install application AWS credentials
  template: 
    src: aws-credentials.j2
    dest: "{{ aws_credentials_dir }}/credentials"
    mode: 0644

- name: install npm dependencies
  npm:
    ci: yes
    path: "{{ project_path }}/node_modules"

- name: remove deploy key
  file: path={{ remote_deploy_key_file }} state=absent

# build commands
- name: build command
  command: npm run build-client chdir={{ project_path }}

- name: stop app
  command: pm2 stop process.json chdir={{ project_path }}
  ignore_errors: yes

- name: start app
  command: pm2 start process.json chdir={{ project_path }}
