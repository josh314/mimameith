- name: create AWS settings directory 
  file:
    path: "{{ aws_profiles__dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory

- name: Render and copy AWS credentials file
  template:
    src: credentials.j2
    dest: "{{ aws_profiles__dir}}/credentials"
    mode: 0644
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Render and copy AWS config file
  template:
    src: config.j2
    dest: "{{ aws_profiles__dir}}/config"
    mode: 0644
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"