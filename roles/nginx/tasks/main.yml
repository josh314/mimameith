# Install nginx and configuration file

- name: install nginx
  apt:
    name: nginx
    update_cache: yes


# The following two tasks ensure the existence of the placeholder index.html file
# This file is only there to test the `server_name` server block if no proxying is set up
- name: create directories for placeholder index file
  file:
    path: "{{ root }}"
    state: directory
- name: copy root index file
  template: 
    src: index.html.j2
    dest: "{{ root }}/index.html"

# unlink the default config
- name: remove default configuration
  file: 
    dest: /etc/nginx/sites-enabled/default
    state: absent

# create and enable the custom config file
- name: render & copy nginx config file
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/{{ server_name }}
    lstrip_blocks: yes
- name: enable configuration
  file: 
    dest: /etc/nginx/sites-enabled/{{ server_name }}
    src: /etc/nginx/sites-available/{{ server_name }}
    state: link

