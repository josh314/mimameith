- name: Deploy mongodb server
  hosts: mongo_servers
  become: yes
  vars_files:
    - secrets.yml
  vars:
    mongodb_admin_user: "{{ db.auth.admin.user }}"
    mongodb_admin_password: "{{ db.auth.admin.password }}"
    mongodb_app_user: "{{ db.auth.app.user }}"
    mongodb_app_password: "{{ db.auth.app.password }}"
    mongodb_backup_user: "{{ db.auth.backup.user }}"
    mongodb_backup_password: "{{ db.auth.backup.password }}"
    mongodb_restore_user: "{{ db.auth.restore.user }}"
    mongodb_restore_password: "{{ db.auth.restore.password }}"
    mongo_s3_restore_aws_access_key: "{{ aws.credentials.admin.aws_access_key_id }}"
    mongo_s3_restore_aws_secret_key: "{{ aws.credentials.admin.aws_secret_access_key }}"

  tasks:

    - name: update apt packages
      apt:
        update-cache: yes
        upgrade: dist
      become: yes

    # Install and configure mongodb
    - import_role:
        name: mongo_setup
      # when: not mongo_server__skip_mongo_setup

    # - import_role:
    #     name: shopify_dump_crons
    #   vars:
    #     shopify_dump_crons__project_path: "/home/{{ ansible_user }}/cron/shopify-dump"
    #     shopify_dump_crons__shopify_store_name: "{{ shopify.apps.shopify_data_dump.store_name }}"
    #     shopify_dump_crons__shopify_api_key: "{{ shopify.apps.shopify_data_dump.api_key }}"
    #     shopify_dump_crons__shopify_password: "{{ shopify.apps.shopify_data_dump.password }}"
    #     shopify_dump_crons__mongo_db_name: ehdb
    #     shopify_dump_crons__mongo_user: "{{ mongodb_app_user }}"
    #     shopify_dump_crons__mongo_password: "{{ mongodb_app_password }}"

    - import_role:
        name: cleanup