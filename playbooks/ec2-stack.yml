
###########################################################
# Provision AWS resources
# =======================
#
###########################################################



- name: Provision AWS resources
  hosts: control
  gather_facts: no
  vars:
    default_org: "{{ org | default('') }}"
    instance_meta:
      - id: app_server
        tier: app_server
        stack: lot-commander
        version_var: "{{ lot_commander__application_repository_version }}"
      - id: load_balancer
        tier: load_balancer
        stack: lot-commander
        name: lot-commander_lb
      - id: db_server
        tier: database
        stack: mimameith
        name: mongodb-server
        extra_tags:
          mongo_ver: "{{ mongodb_major_version }}"
      - id: product_data_cache_updater_server
        tier: database
        stack: mimameith
        name: product-data-cache-updater
        version_var: "{{ product_data_cache_updater__application_repository_version }}"

  tasks:

  #####################################################################################
  # Sanity checks
  # ===============================
  #
  #####################################################################################

    - name: Fail if MongoDB version is too old for the Ubuntu version
      fail:
        msg: >-
          MongoDB {{ mongodb_major_version }} is not supported on Ubuntu {{ ubuntu_version }}.
      when: >
        (mongodb_major_version | int < 6 and ubuntu_version == '22.04') or
        (mongodb_major_version | int < 8 and ubuntu_version == '24.04')

    - name: check if elastic IPs are defined
      fail:
        msg: "Elastic IPs for db_server_eip and load_balancer_eip must be defined in extra-vars.yml"
      when: (db_server_eip is not defined or db_server_eip == '') or (load_balancer_eip is not defined or load_balancer_eip == '')

    - name: retrieve all allocated EIP addresses
      amazon.aws.ec2_eip_info:
        region: "{{ aws_region }}"
        filters:
          tag:env: "{{ stack_env }}"
      register: allocated_eips

    - name: Fail if the elastic IPs are not allocated and tagged for the current environment ({{ stack_env}})
      fail:
        msg: "Elastic IP {{ item }} is not allocated in AWS with the environment tag `{{ stack_env }}`. Please allocate and tag it before running this playbook."
      when: item not in allocated_eips.addresses | map(attribute='public_ip') | list
      loop:
        - "{{ db_server_eip }}"
        - "{{ load_balancer_eip }}"

  #####################################################################################
  # Set Ubuntu version and find AMI
  # ===============================
  #
  #####################################################################################

    - name: Set default Ubuntu version if not defined
      set_fact:
        ubuntu_version: "20.04"
      when: ubuntu_version is not defined

    - name: Normalize ubuntu_version as string with 2 decimal places
      set_fact:
        ubuntu_version_str: "{{ '%.2f' | format(ubuntu_version | float) }}"

    - name: Define Ubuntu version info map
      set_fact:
        ubuntu_version_info:
          "18.04":
            codename: "bionic"
            name_filter: "ubuntu/images/hvm-ssd/ubuntu-bionic-18.04-amd64-server-*"
          "20.04":
            codename: "focal"
            name_filter: "ubuntu/images/hvm-ssd/ubuntu-focal-20.04-amd64-server-*"
          "22.04":
            codename: "jammy"
            name_filter: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"
          "24.04":
            codename: "noble"
            name_filter: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"

    - name: Set ubuntu_version_codename and ami_name_filter from version map
      set_fact:
        ubuntu_version_codename: "{{ ubuntu_version_info[ubuntu_version_str].codename }}"
        ami_name_filter: "{{ ubuntu_version_info[ubuntu_version_str].name_filter }}"
      when: ubuntu_version_info[ubuntu_version_str] is defined

    - name: Fail if Ubuntu version unsupported
      fail:
        msg: "Unsupported ubuntu_version '{{ ubuntu_version }}' (normalized: '{{ ubuntu_version_str }}')"
      when: ubuntu_version_info[ubuntu_version_str] is not defined

    - name: Find Ubuntu {{ ubuntu_version }} LTS AMIs
      amazon.aws.ec2_ami_info:
        owners: ['099720109477']  # Canonical's AWS account ID
        filters:
          name: "{{ ami_name_filter }}"
          architecture: x86_64
          root-device-type: ebs
          virtualization-type: hvm
        region: "{{ aws_region }}"
      register: ubuntu_amis

    - name: Set new fact of AMI ID to be the most recent Ubuntu AMI
      set_fact:
        ami_id: "{{ ( ubuntu_amis.images | sort(attribute='creation_date') | last )['image_id'] }}"
      when: ubuntu_amis.images | length > 0


  #####################################################################################
  # Set EC2 instance metadata
  # =========================
  #
  #####################################################################################

    - name: Generate count_tags and instance_filter for all instances
      set_fact:
        "{{ item.id }}_count_tags": >-
          {{
            {
              'tier': item.tier,
              'stack': item.stack,
              'org': default_org,
              'env': stack_env
            }
            | combine(
                item.name is defined | ternary({ 'Name': item.name }, {})
              )
            | combine( { 'os': "ubuntu-{{ ubuntu_version }}" } )
            | combine(
                item.version_var is defined | ternary({ 'version': item.version_var }, {})
              )
            | combine( item.extra_tags | default({}) )
          }}
        "{{ item.id }}_instance_filter": >-
          {{
            {
              'instance-state-name': 'running',
              'tag:tier': item.tier,
              'tag:stack': item.stack,
              'tag:org': default_org,
              'tag:env': stack_env
            }
            | combine(
                item.name is defined | ternary({ 'tag:Name': item.name }, {})
              )
            | combine(
                item.version_var is defined | ternary({ 'tag:version': item.version_var }, {})
              )
          }}
      loop: "{{ instance_meta }}"

  #####################################################################################
  # EC2 provisioning and configuration
  # ==================================
  #
  #####################################################################################

    - name: Provision the Database instance in EC2
      amazon.aws.ec2_instance:
        state: running
        image:
          id: "{{ ami_id }}"
        region: "{{ aws_region }}"
        instance_type: "{{ db_server_instance_type }}"
        key_name: "{{ db_server_key_name }}"
        security_groups:
          - Internal
          - default
          - EHDB
        tags: "{{ db_server_count_tags }}"
        filters: "{{ db_server_instance_filter }}"
        exact_count: "{{ num_db_servers }}"
        detailed_monitoring: "{{ stack_env == 'prod' }}"
        metadata_options:
          http_endpoint: enabled
          http_protocol_ipv6: enabled
          http_tokens: required
          http_put_response_hop_limit: 1
          instance_metadata_tags: enabled
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 8
              volume_type: gp3
              delete_on_termination: true
      register: ec2_db_server_ec2_instance_result
      when: provision__db_server


    - name: Provision the load balancer instance in EC2
      amazon.aws.ec2_instance:
        state: running
        image:
          id: "{{ ami_id }}"
        region: "{{ aws_region }}"
        instance_type: "{{ load_balancer_instance_type }}"
        key_name: "{{ load_balancer_key_name }}"
        security_groups:
          - Internal
          - default
          - lot_commander::load_balancer
          - public web server
        tags: "{{ load_balancer_count_tags }}"
        filters: "{{ load_balancer_instance_filter }}"
        exact_count: 1
        detailed_monitoring: "{{ stack_env == 'prod' }}"
        metadata_options:
          http_endpoint: enabled
          http_protocol_ipv6: enabled
          http_tokens: required
          http_put_response_hop_limit: 1
          instance_metadata_tags: enabled
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 8
              volume_type: gp3
              delete_on_termination: true
      register: ec2_load_balancer_ec2_instance_result
      when: provision__load_balancer


    - name: Provision the application instance(s) in EC2
      amazon.aws.ec2_instance:
        state: running
        image:
          id: "{{ ami_id }}"
        region: "{{ aws_region }}"
        instance_type: "{{ app_server_instance_type }}"
        key_name: "{{ app_server_key_name }}"
        security_groups:
          - Internal
          - default
          - EHDB access
          - lot_commander::app_server
        tags: "{{ app_server_count_tags }}"
        filters: "{{ app_server_instance_filter }}"
        exact_count: "{{ num_app_servers }}"
        detailed_monitoring: "{{ stack_env == 'prod' }}"
        metadata_options:
          http_endpoint: enabled
          http_protocol_ipv6: enabled
          http_tokens: required
          http_put_response_hop_limit: 1
          instance_metadata_tags: enabled
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 8
              volume_type: gp3
              delete_on_termination: true
      register: ec2_app_server_ec2_instance_result
      when: provision__app_servers


    - name: Provision the product-data-cache-updater instance in EC2
      amazon.aws.ec2_instance:
        state: running
        image:
          id: "{{ ami_id }}"
        region: "{{ aws_region }}"
        instance_type: "{{ product_data_cache_updater_server_instance_type }}"
        key_name: "{{ product_data_cache_updater_server_key_name }}"
        security_groups:
          - Internal
          - default
          - EHDB access
          - outbound-web
        tags: "{{ product_data_cache_updater_server_count_tags }}"
        filters: "{{ product_data_cache_updater_server_instance_filter }}"
        exact_count: 1
        detailed_monitoring: "{{ stack_env == 'prod' }}"
        metadata_options:
          http_endpoint: enabled
          http_protocol_ipv6: enabled
          http_tokens: required
          http_put_response_hop_limit: 1
          instance_metadata_tags: enabled
        volumes:
          - device_name: /dev/sda1
            ebs:
              volume_size: 8
              volume_type: gp3
              delete_on_termination: true
      register: ec2_product_data_cache_updater_server_ec2_instance_result
      when: provision__product_data_cache_updater

    #################################################################################################
    ## Setting facts for later use

    # database facts

    - name: "Setting fact: mongodb_server_deployed"
      set_fact:
        mongodb_server_deployed: '{{ ec2_db_server_ec2_instance_result is defined and ec2_db_server_ec2_instance_result.changed }}'

    - name: "Setting fact: db_server_instances (from ec2_instance result)"
      set_fact:
        db_server_instances: '{{ ec2_db_server_ec2_instance_result.instances }}'
      when: ec2_db_server_ec2_instance_result.instances is defined and ec2_db_server_ec2_instance_result.instances[0] is defined

    - name: "Setting fact: db_server_private_ip"
      set_fact:
        db_server_private_ip: '{{ db_server_instances[0].private_ip_address }}'
      when: db_server_instances is defined and db_server_instances[0] is defined

    - name: "Setting fact: db_server_public_ip"
      set_fact:
        db_server_public_ip: '{{ db_server_instances[0].public_ip_address }}'
      when: db_server_instances is defined and db_server_instances[0] is defined

    - name: "Setting fact: db_server_instance_id (from ec2_instance result)"
      set_fact:
        db_server_instance_id: '{{ ec2_db_server_ec2_instance_result.instances[0].instance_id }}'
      when: ec2_db_server_ec2_instance_result.instances is defined and ec2_db_server_ec2_instance_result.instances[0] is defined

    - name: "Setting fact: db_server_instance_id"
      set_fact:
        db_server_instance_id: '{{ db_server_instances[0].instance_id }}'
      when: db_server_instances is defined and db_server_instances[0] is defined

    # load balancer facts

    - name: "Setting fact: load_balancer_instances (from ec2_instance result)"
      set_fact:
        load_balancer_instances: '{{ ec2_load_balancer_ec2_instance_result.instances }}'
      when: ec2_load_balancer_ec2_instance_result.instances is defined and ec2_load_balancer_ec2_instance_result.instances[0] is defined

    - name: "Setting fact: load_balancer_public_ip"
      set_fact:
        load_balancer_public_ip: '{{ load_balancer_instances[0].public_ip_address }}'
      when: load_balancer_instances is defined and load_balancer_instances[0] is defined

    - name: "Setting fact: load_balancer_instance_id (from ec2_instance result)"
      set_fact:
        load_balancer_instance_id: '{{ ec2_load_balancer_ec2_instance_result.instances[0].instance_id }}'
      when: ec2_load_balancer_ec2_instance_result.instances is defined and ec2_load_balancer_ec2_instance_result.instances[0] is defined

    - name: "Setting fact: load_balancer_instance_id"
      set_fact:
        load_balancer_instance_id: '{{ load_balancer_instances[0].instance_id }}'
      when: load_balancer_instances is defined and load_balancer_instances[0] is defined

    # app server facts

    - name: "Setting fact: app_server_instances (from ec2_instance result)"
      set_fact:
        app_server_instances: '{{ ec2_app_server_ec2_instance_result.instances }}'
      when: ec2_app_server_ec2_instance_result.instances is defined and ec2_app_server_ec2_instance_result.instances[0] is defined

    - name: "Setting fact: app_server_addresses"
      set_fact:
        app_server_addresses: '{{ app_server_instances | map(attribute="private_ip_address") | map("regex_replace", "^(.*)$", "\1:80") | list }}'
      when: app_server_instances is defined and app_server_instances[0] is defined

    # product data cache updater facts

    - name: "Setting fact: product_data_cache_updater_server_instances (from ec2_instance result)"
      set_fact:
        product_data_cache_updater_server_instances: '{{ ec2_product_data_cache_updater_server_ec2_instance_result.instances }}'
      when: ec2_product_data_cache_updater_server_ec2_instance_result.instances is defined and ec2_product_data_cache_updater_server_ec2_instance_result.instances[0] is defined

    #################################################################################################
    ## Wait for servers to be available

    - name: Initialize empty wait list
      set_fact:
        wait_list: []

    - name: Add db to wait list
      set_fact:
        wait_list: "{{ wait_list + db_server_instances }}"
      when: db_server_instances is defined

    - name: Add load balancer to wait list
      set_fact:
        wait_list: "{{ wait_list + load_balancer_instances }}"
      when: load_balancer_instances is defined

    - name: Add app servers to wait list
      set_fact:
        wait_list: "{{ wait_list + app_server_instances }}"
      when: app_server_instances is defined

    - name: Add product data cache updater to wait list
      set_fact:
        wait_list: "{{ wait_list + product_data_cache_updater_server_instances }}"
      when: product_data_cache_updater_server_instances is defined

    - name: Wait for connections to wait list hosts
      wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        search_regex: OpenSSH
      loop: "{{ wait_list }}"
      loop_control:
        loop_var: item
        index_var: idx
        label: "{{ item.tags.Name if items.tags.Name is defined else item.tags.tier }}"


    #################################################################################################
    ## EC2 level configuration

    # naming app server instances
    # this pattern of including a separate file is needed in order to loop over multiple tasks
    - name: Tagging app server resources with an iterated Name tag
      include_tasks: app_server_name_tasks.yml
      loop: "{{ app_server_instances }}"
      loop_control:
        loop_var: app_server
        index_var: idx
        label: "{{ app_server.instance_id }}"
      when: app_server_instances is defined and app_server.tags.Name is not defined

    # Setting elastic IPs for load balancer and db server
    - name: Associate Elastic IP with load balancer
      amazon.aws.ec2_eip:
        device_id: "{{ load_balancer_instance_id }}"
        ip: "{{ load_balancer_eip }}"
        allow_reassociation: true
      register: ec2_load_balancer_eip_result
      when: load_balancer_instance_id is defined and load_balancer_eip is defined

    - name: Associate Elastic IP with db server
      amazon.aws.ec2_eip:
        device_id: "{{ db_server_instance_id }}"
        ip: "{{ db_server_eip }}"
        allow_reassociation: true
      register: ec2_db_server_eip_result
      when: db_server_instance_id is defined and db_server_eip is defined

    #################################################################################################
    ## DNS

    - name: set internal DNS name for db server
      amazon.aws.route53:
        state: present
        zone: "{{ hosted_zone }}"
        private_zone: true
        record: "{{ db_server_private_hostname }}"
        type: A
        value: "{{ db_server_private_ip }}"
        overwrite: true
      when: db_server_private_ip is defined

    - name: set public DNS name for db server
      amazon.aws.route53:
        state: present
        zone: "{{ hosted_zone }}"
        record: "{{ db_server_public_hostname }}"
        type: A
        value: "{{ db_server_eip }}"
        overwrite: true

    - name: set public DNS name for load balancer
      amazon.aws.route53:
        state: present
        zone: "{{ hosted_zone }}"
        record: "{{ load_balancer_hostname }}"
        type: A
        value: "{{ load_balancer_eip }}"
        overwrite: true

    #################################################################################################
    ## Adding newly provisioned hosts to inventory

    - name: add database EIP to inventory
      add_host:
        hostname: "{{ db_server_eip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ db_server_key_file }}"
        groups:
          - mongo_servers

    - name: add load balancer EIP to inventory
      add_host:
        hostname: "{{ load_balancer_eip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ load_balancer_key_file }}"
        groups:
          - load_balancer

    - name: add app server host(s) to inventory
      add_host:
        hostname: "{{ app_server.public_ip_address }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ app_server_key_file }}"
        groups:
          - app_servers
      loop: "{{ app_server_instances }}"
      loop_control:
        loop_var: app_server
        label: "instance: {{ app_server.instance_id }}, public_dns: {{ app_server.public_dns_name }}, public_ip: {{ app_server.public_ip_address }}"
      when: app_server_instances is defined and app_server.public_ip_address is defined

    - name: add product data cache updater server host(s) to inventory
      add_host:
        hostname: "{{ server.public_ip_address }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ product_data_cache_updater_server_key_file }}"
        groups:
          - product_data_cache_updater
      loop: "{{ product_data_cache_updater_server_instances }}"
      loop_control:
        loop_var: server
        label: "instance: {{ server.instance_id }}, public_dns: {{ server.public_dns_name }}, public_ip: {{ server.public_ip_address }}"
      when: product_data_cache_updater_server_instances is defined and server.public_ip_address is defined


###########################################################
# Configure provisioned resources with server playbooks
# =====================================================
#
###########################################################

- name: Mongo server playbook
  import_playbook: mongo-server.yml
  vars:
    mongodb_major_version: "{{ hostvars[ groups['control'][0] ].mongodb_major_version }}"
    ubuntu_version_codename: "{{ hostvars[ groups['control'][0] ].ubuntu_version_codename }}"
    mongo_server__skip_mongo_setup: "{{ not hostvars[ groups['control'][0] ].mongodb_server_deployed }}"
    mongo_skip_s3_backups: "{{ hostvars[ groups['control'][0] ].mongo_skip_s3_backups | default(false) }}"
  when: configure__db_server

- name: Configure load balancer
  import_playbook: load-balancer.yml
  vars:
    server_hostname: "{{ hostvars[ groups['control'][0] ].load_balancer_hostname }}"
    server_nodes: "{{ hostvars[ groups['control'][0] ].app_server_addresses }}"
  when: configure__load_balancer

- name: Application server(s) playbook
  import_playbook: app.yml
  vars:
    db_host: "{{ hostvars[ groups['control'][0] ].db_server_private_hostname }}"
  when: configure__app_servers

- name: Product data cache updater server
  import_playbook: product-data-cache-updater-server.yml
  vars:
    db_host: "{{ hostvars[ groups['control'][0] ].db_server_private_hostname }}"
  when: configure__product_data_cache_updater
