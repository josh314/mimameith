- name: Configure load balancer
  hosts: load_balancer
  become: yes
  vars_files:
    - ../secrets.yml

  tasks:

    - name: Upgrade packages
      apt:
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    # Install nginx and configure as a load balancer for the application servers
    - import_role:
        name: nginx
      vars:
        server_name: "{{ server_hostname }}"
        upstream_servers: "{{ server_nodes }}"
        key_file: "/etc/letsencrypt/live/{{ server_hostname }}/privkey.pem"
        cert_file: "/etc/letsencrypt/live/{{ server_hostname }}/fullchain.pem"
        tls_enabled: true

    - name: Install pip
      apt:
        name: python3-pip

    - name: Install python packages
      pip:
        name:
          - botocore
          - boto3

    - name: Create parent directories
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        mode: '0700'
        owner: root

    - name: Create AWS credentials file for Route 53 access
      ansible.builtin.copy:
        dest: "/root/.aws/credentials"
        content: |
          [default]
          aws_access_key_id = {{ aws.credentials.admin.aws_access_key_id }}
          aws_secret_access_key = {{ aws.credentials.admin.aws_secret_access_key }}
        owner: root
        mode: '0600'

    # Generate OpenSSL keys and certification with Let's Encrypt
    # Note the --deploy-hook option which restarts nginx after the cert is generated
    - import_role:
        name: thiagoalmeidasa.certbot_route53
      vars:
        certbot_admin_email: "{{ maintenance_contact_email }}"
        certbot_auto_renew_user: root
        certbot_auto_renew_minute: "20"
        certbot_auto_renew_hour: "5"
        certbot_auto_renew_options: >-
          --quiet --no-self-upgrade --dns-route53 --deploy-hook "/bin/systemctl restart nginx"
        certbot_certs:
          - domains:
            - "{{ server_hostname }}"

    - name: restart nginx
      service: name=nginx state=restarted

    - import_role:
        name: cleanup