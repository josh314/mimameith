
- name: Provision AWS resources
  hosts: control
  gather_facts: no
  vars:
    cronbox_count_tags:
      Name: cronbox
      tier: crons
      org: "{{ org | default('') }}"
      env: "{{ stack_env }}"
    cronbox_instance_filter:
      instance-state-name: running
      tag:Name: cronbox
      tag:tier: crons
      tag:org: "{{ org | default('') }}"
      tag:env: "{{ stack_env }}"


###########################################################
# Provision resources
# ===================
#
###########################################################


  tasks:

    - name: Launch the cronbox server instance in EC2
      amazon.aws.ec2_instance:
        state: running
        image:
          id: "{{ cronbox_ami }}"
        region: "{{ cronbox_region }}"
        instance_type: "{{ cronbox_instance_type }}"
        key_name: "{{ cronbox_key_name }}"
        security_groups:
          - sg-052e5c37ecfa0cd7b # Internal
          - sg-ef6fc897 # default (old)
        tags: "{{ cronbox_count_tags }}"
        filters: "{{ cronbox_instance_filter }}"
        exact_count: "{{ num_cronbox }}"
        detailed_monitoring: "{{ stack_env == 'prod' }}"
      register: ec2_cronbox_ec2_instance_result

    - name: Associate Elastic IP with cronbox
      community.aws.ec2_eip:
        device_id: "{{ ec2_cronbox_ec2_instance_result.instances[0].instance_id }}"
        ip: "{{ cronbox_eip }}"
      register: ec2_cronbox_eip_result

    - name: add cronbox host elastic IP to inventory
      add_host:
        hostname: "{{ ec2_cronbox_eip_result.public_ip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ cronbox_key_file }}"
        groups:
          - cronbox
      when: ec2_cronbox_eip_result.public_ip is defined

    - name: Wait for connection to cronbox
      wait_for:
        host: "{{ cronbox_eip }}"
        port: 22
        search_regex: OpenSSH

###########################################################
# Configure provisioned resources
# ===============================
#
###########################################################

- name: Cronbox server playbook
  import_playbook: cronbox.yml

###########################################################
# Set update crons
# ================
#
###########################################################

- name: Set update cron (cronbox)
  hosts: cronbox
  tasks:
    - import_role:
        name: auto_upgrade_cron
      vars:
        auto_upgrade_cron_hour: '8' # 3AM in EST
        auto_upgrade_cron_minute: '0'
