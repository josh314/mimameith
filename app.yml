- name: launch lot-commander app-server
  hosts: app_servers
  vars_files:
    - secrets.yml
  vars:
    lot_commander__application_repository_version: master
    app_port: 9000
    path: "{{ ansible_env.HOME }}/lot-commander"
    skip_application_auth: false

  # TODO? use HTTP2

  tasks:

    - name: Upgrade packages
      become: yes
      apt: 
        upgrade: yes
        update_cache: yes
        cache_valid_time: 3600

    # - name: install emacs
    #   become: yes
    #   apt: name=emacs

    # install npm/node and global node packages
    - import_role:
        name: geerlingguy.nodejs
      become: yes
      vars:
        nodejs_version: "12.x"

    # Install nginx and configure as a reverse proxy for the application
    - import_role:
        name: nginx
      become: yes
      vars:
        server_name: lot-commander.wholesaleninjas.com
        tls_enabled: false
        upstream_servers:
          - localhost:{{ app_port }}

    - name: Stop app if already running. Ignore error caused by app not running yet 
      command: pm2 stop process.json
      args:
        chdir: "{{ path }}"
      ignore_errors: yes

    - import_role: 
        name: lot_commander
      vars:
        lot_commander__application_repository: git@gitlab.com:josh314/lot-commander.git
        lot_commander__application_port: "{{ app_port }}"
        lot_commander__project_path: "{{ path }}"
        local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
        remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/id_ed25519
        lot_commander__skip_auth: "{{ skip_application_auth }}"
        db_app_user: "{{ db.auth.app.user }}"
        db_app_password: "{{ db.auth.app.password }}"
        lot_commander__aws_access_key_id: "{{ aws.credentials.lot_commander.aws_access_key_id }}"
        lot_commander__aws_secret_access_key: "{{ aws.credentials.lot_commander.aws_secret_access_key }}"
        lot_commander__session_secret: "{{ lot_commander.session_secret }}"

    - import_role:
        name: pm2_app_service
      vars:
        pm2_app_service__path: "{{ path }}"

    - name: restart nginx
      become: yes
      service: name=nginx state=restarted

    - import_role:
        name: cleanup