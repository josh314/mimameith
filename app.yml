- name: launch lot-commander app-server
  hosts: app_servers
  vars_files:
    - secrets.yml
  vars:
    version: master
    app_config: ~/dev/apps/lot-commander/config-prod.js
    app_port: 9000
    path: "{{ ansible_env.HOME }}/lot-commander"
    skip_application_auth: false
    # nginx_conf_file: /etc/nginx/sites-available/lots.wholesaleninjas.com

  # TODO? use nvm

  # TODO? use HTTP2

  tasks:

    # TODO: provision ec2 instance
      # set security groups

    - name: Upgrade packages
      become: yes
      apt: 
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    - name: install emacs
      become: yes
      apt: name=emacs

    # # install git
    # - import_role:
    #     name: geerlingguy.git
    #   become: yes

    # install npm/node and global node packages
    - import_role:
        name: geerlingguy.nodejs
      become: yes
      vars:
        nodejs_version: "12.x"

    # # install pm2
    - name: install pm2
      become: yes
      npm: name=pm2 global=yes production=yes


    # TODO? copy pm2 process.json (template?) to remote


    # TODO: config TLS/SSL
    # certbot

    # TODO: firewall and opening of ports
      # ufw
      # nginx conf
      # ec2 security groups


    # Install nginx and configure as a reverse proxy for the application
    - import_role:
        name: nginx
      become: yes
      vars:
        server_name: lots.wholesaleninjas.com
        application_port: "{{ app_port }}"
        # conf_file: "{{ nginx_conf_file }}"

    - import_role: 
        name: lot_commander
      vars:
        application_repository: git@gitlab.com:josh314/lot-commander.git
        application_repository_version: "{{ version }}"
        # application_config_file: "{{ app_config }}"
        application_port: "{{ app_port }}"
        project_path: "{{ path }}"
        local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
        remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/id_ed25519
        skip_auth: "{{ skip_application_auth }}"


    # TODO? mkdir any necessary directories for logs, images or other files

    - name: restart nginx
      become: yes
      service: name=nginx state=restarted
      
    - name: Clean up packages
      become: yes
      apt:
        autoclean: yes
        autoremove: yes