- name: Application playbook
  import_playbook: app.yml
  vars:
    db_host: "{{ hostvars[ groups['control'][0] ].db_server_instances[0].private_ip_address }}"
    manifest_service_location: "{{ hostvars[ groups['control'][0] ].manifest_service_instances[0].private_ip_address }}:{{ hostvars[ groups['manifest_service'][0] ].manifest_service__port }}"

