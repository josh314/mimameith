
###########################################################
# Provision AWS resources
# =======================
#
###########################################################

- name: Provision AWS resources
  hosts: control
  gather_facts: no
  vars:
    app_server_count_tags:
      tier: app_server
      stack: lot-commander
      org: "{{ org | default('') }}"
      env: "{{ stack_env }}"
      version: "{{ lot_commander__application_repository_version }}"
    load_balancer_count_tags:
      Name: lot-commander_lb
      tier: load_balancer
      stack: lot-commander
      org: "{{ org | default('') }}"
      env: "{{ stack_env }}"
    db_server_count_tags:
      Name: mongodb-server
      tier: database
      stack: lot-commander
      org: "{{ org | default('') }}"
      env: "{{ stack_env }}"
    manifest_service_count_tags:
      Name: manifest-svc
      tier: service
      stack: mimameith
      org: "{{ org | default('') }}"
      env: "{{ stack_env }}"


  tasks:

    - name: Launch the Database instance in EC2
      ec2:
        wait: yes
        image: "{{ db_server_ami }}"
        region: "{{ db_server_region }}"
        instance_type: "{{ db_server_instance_type }}"
        key_name: "{{ db_server_key_name }}"
        group:
          - Internal
          - default
          - EHDB
        instance_tags: "{{ db_server_count_tags }}"
        exact_count: "{{ num_db_servers }}"
        count_tag: "{{ db_server_count_tags }}"
      register: ec2_db_servers

    # - debug: var=ec2_db_servers

    - name: Launch the load balancer instance in EC2
      ec2:
        wait: yes
        image: "{{ load_balancer_ami }}"
        region: "{{ load_balancer_region }}"
        instance_type: "{{ load_balancer_instance_type }}"
        key_name: "{{ load_balancer_key_name }}"
        group:
          - Internal
          - default
          - "lot_commander::load_balancer"
        instance_tags: "{{ load_balancer_count_tags }}"
        exact_count: 1
        count_tag: "{{ load_balancer_count_tags }}"
      register: ec2_load_balancer

    # - debug: var=ec2_load_balancer

    - name: Launch the manifest service instance(s) in EC2
      ec2:
        wait: yes
        image: "{{ manifest_service_ami }}"
        region: "{{ manifest_service_region }}"
        instance_type: "{{ manifest_service_instance_type }}"
        key_name: "{{ manifest_service_key_name }}"
        group:
          - Internal
          - default
          - "expresshop_service::manifest"
        instance_tags: "{{ manifest_service_count_tags }}"
        exact_count: "{{ num_manifest_service }}"
        count_tag: "{{ manifest_service_count_tags }}"
      register: ec2_manifest_service

    # - debug: var=ec2_manifest_service

    - name: Launch the application instance(s) in EC2
      ec2:
        wait: yes
        image: "{{ app_server_ami }}"
        region: "{{ app_server_region }}"
        instance_type: "{{ app_server_instance_type }}"
        key_name: "{{ app_server_key_name }}"
        group:
          - Internal
          - default
          - EHDB access
          - "lot_commander::app_server"
        instance_tags: "{{ app_server_count_tags }}"
        exact_count: "{{ num_app_servers }}"
        count_tag: "{{ app_server_count_tags }}"
      register: ec2_app_servers

    # - debug: var=ec2_app_servers

    # Adding instance names
    - name: Tagging app server instances with a Name
      ec2_tag:
        resource: "{{ app_server.id }}"
        tags:
          Name: "lot-commander_{{idx}}"
      loop: "{{ ec2_app_servers.tagged_instances }}"
      loop_control:
        loop_var: app_server
        index_var: idx
        label: "{{ app_server.id }}"
      when: app_server.tags.Name is not defined

    # Setting these facts here since registered variables will not be available in the later playbooks
    - name: "Setting fact: mongodb_server_deployed"
      set_fact:
        mongodb_server_deployed: '{{ ec2_db_servers.changed }}'

    - name: "Setting fact: app_server_addr"
      set_fact:
        app_server_addr: '{{ ec2_app_servers.tagged_instances | map(attribute="private_ip") | map("regex_replace", "^(.*)$", "\1:80") | list }}'

    - name: "Setting fact: db_server_host"
      set_fact:
        db_server_host: '{{ ec2_db_servers.tagged_instances[0].private_ip }}'

    - name: "Setting fact: manifest_service_host"
      set_fact:
        manifest_service_host: '{{ ec2_manifest_service.tagged_instances[0].private_ip }}'

    - name: Associate Elastic IP with load balancer
      ec2_eip:
        device_id: "{{ ec2_load_balancer.tagged_instances[0].id }}"
        ip: "{{ load_balancer_eip }}"
        region: "{{ ec2_load_balancer.tagged_instances[0].region }}"
      register: ec2_load_balancer_eip_result

    # - debug: var=ec2_load_balancer_eip_result

    # Adding newly provisioned hosts to inventory

    - name: add db server host(s) to inventory
      add_host:
        hostname: "{{ item.public_ip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ db_server_key_file }}"
        groups:
          - mongo_servers
      with_items: "{{ ec2_db_servers.tagged_instances }}"
      when: item.public_ip is defined

    - name: add load balancer host elastic IP to inventory
      add_host:
        hostname: "{{ ec2_load_balancer_eip_result.public_ip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ load_balancer_key_file }}"
        groups:
          - load_balancer
      when: ec2_load_balancer_eip_result.public_ip is defined

    - name: add app server host(s) to inventory
      add_host:
        hostname: "{{ app_server.public_ip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ app_server_key_file }}"
        groups:
          - app_servers
      loop: "{{ ec2_app_servers.tagged_instances }}"
      loop_control:
        loop_var: app_server
        label: "instance: {{ app_server.id }}, public_dns: {{ app_server.public_dns_name }}"
      when: app_server.public_ip is defined

    - name: add manifest service host(s) to inventory
      add_host:
        hostname: "{{ item.public_ip }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ manifest_service_key_file }}"
        groups:
          - manifest_service
      with_items: "{{ ec2_manifest_service.tagged_instances }}"
      when: item.public_ip is defined

    # TODO: use wait_for_connection module instead of wait_for?
    - name: wait for newly added hosts to be ready for SSH connections
      wait_for:
        host: "{{ item.public_ip }}"
        port: 22
        search_regex: OpenSSH
      with_items: "{{ ec2_db_servers.tagged_instances + ec2_app_servers.tagged_instances + [ ec2_load_balancer_eip_result ] }}"
      when: item.public_ip is defined

    # - debug: var=hostvars

###########################################################
# Configure provisioned resources
# ===============================
#
###########################################################

- name: Mongo server playbook
  import_playbook: mongo-server.yml
  vars:
    mongodb_bind_ip: 127.0.0.1,{{ hostvars[ groups['control'][0] ].db_server_host }}
    mongo_server__skip_mongo_setup: "{{ not hostvars[ groups['control'][0] ].mongodb_server_deployed }}"

- name: Configure load balancer
  import_playbook: load-balancer.yml
  vars: 
    server_nodes: "{{ hostvars[ groups['control'][0] ].app_server_addr }}"

- name: Application playbook
  import_playbook: app.yml
  vars:
    db_host: "{{ hostvars[ groups['control'][0] ].db_server_host }}"
    manifest_service_location: "{{ hostvars[ groups['control'][0] ].manifest_service_host }}:{{ hostvars[ groups['manifest_service'][0] ].manifest_service__port }}"

- name: Manifest service playbook
  import_playbook: manifest-service.yml
  vars:
    expresshop_manifest_service__application_port: "{{ manifest_service__port }}"

###########################################################
# Set update crons
# ================
# Set at staggered intervals so reboots happen in correct order
###########################################################

- name: Set update cron (database)
  hosts: mongo_servers
  tasks:
    - import_role:
        name: auto_upgrade_cron
      vars:
        auto_upgrade_cron_hour: '8' # 3AM in EST
        auto_upgrade_cron_minute: '0'

- name: Set update cron (app servers)
  hosts: app_servers
  tasks:
    - import_role:
        name: auto_upgrade_cron
      vars:
        auto_upgrade_cron_hour: '8' # 3AM in EST
        auto_upgrade_cron_minute: '30'

- name: Set update cron (load balancer)
  hosts: load_balancer
  tasks:
    - import_role:
        name: auto_upgrade_cron
      vars:
        auto_upgrade_cron_hour: '9' # 4AM in EST
        auto_upgrade_cron_minute: '0'

# This one can run whenever
- name: Set update cron (manifest service)
  hosts: manifest_service
  tasks:
    - import_role:
        name: auto_upgrade_cron
      vars:
        auto_upgrade_cron_hour: '9' # 4AM in EST
        auto_upgrade_cron_minute: '0'