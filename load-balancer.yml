- name: configure provisioned servers
  hosts: load_balancer
  become: yes
  vars:
    ssl_key_dir: /etc/ssl/private
    ssl_key_file: "{{ ssl_key_dir }}/{{ server_hostname }}.key"
    ssl_cert_dir: /etc/ssl/certs
    ssl_cert_file: "{{ ssl_cert_dir }}/{{ server_hostname }}.crt"
    ssl_csr_file: "{{ ssl_cert_dir }}/{{ server_hostname }}.csr"

  tasks:

    - name: Upgrade packages
      apt: 
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    # Install nginx and configure as a load balancer for the application servers
    - import_role:
        name: nginx
      vars:
        server_name: "{{ server_hostname }}"
        upstream_servers: "{{ server_nodes }}"
        key_file: "{{ ssl_key_file }}"
        cert_file: "{{ ssl_cert_file }}"
        tls_enabled: true

    - name: Ensure directory exists for local self-signed TLS certs.
      file:
        path:
          - "{{ ssl_key_dir }}"
          - "{{ ssl_cert_dir }}"
        state: directory

    - name: Generate an OpenSSL private key.
      openssl_privatekey:
        path: "{{ ssl_key_file }}"

    - name: Generate an OpenSSL CSR.
      openssl_csr:
        path: "{{ ssl_csr_file }}"
        privatekey_path: "{{ ssl_key_file }}"
        common_name: "{{ server_hostname }}"

    - name: Generate a Self Signed OpenSSL certificate.
      openssl_certificate:
        path: "{{ ssl_cert_file }}"
        privatekey_path: "{{ ssl_key_file }}"
        csr_path: "{{ ssl_csr_file }}"
        provider: selfsigned

    - name: restart nginx
      service: name=nginx state=restarted
      
    - name: Clean up packages
      apt:
        autoclean: yes
        autoremove: yes