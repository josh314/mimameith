- name: configure shopify dump cron server
  hosts: shopify_data_dump
  vars_files:
    - secrets.yml
  vars:
    shopify_data_dump__application_repository_version: production
    path: "{{ ansible_env.HOME }}/shopify-data-dump"

  # TODO? use HTTP2

  tasks:

    - name: Upgrade packages
      become: yes
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 3600

    # install npm/node and global node packages
    - import_role:
        name: geerlingguy.nodejs
      become: yes
      vars:
        nodejs_version: "18.x"

    - name: Stop app if already running. Ignore error caused by app not running yet
      command: pm2 stop process.json
      args:
        chdir: "{{ path }}"
      ignore_errors: yes

    - import_role:
        name: shopify_data_dump
      vars:
        shopify_data_dump__application_repository: git@gitlab.com:wazue/shopify-data-dump.git
        shopify_data_dump__project_path: "{{ path }}"
        local_deploy_key_file: ~/.ssh/aws_deploy_key_ed25519
        remote_deploy_key_file: /home/{{ ansible_user }}/.ssh/id_ed25519
        db_shopify_data_dump_user: "{{ db.auth.shopify_data_dump.user }}"
        db_shopify_data_dump_password: "{{ db.auth.shopify_data_dump.password }}"
        shopify_credentials: "{{ shopify.apps.shopify_data_dump }}"
        shopify_data_dump__sendgrid_api_key: "{{ sendgrid.api_keys.shopify_data_dump }}"
        shopify_data_dump__contact_email: "{{ maintenance_contact_email }}"

    - import_role:
        name: pm2_app_service
      vars:
        pm2_app_service__path: "{{ path }}"

    - import_role:
        name: cleanup